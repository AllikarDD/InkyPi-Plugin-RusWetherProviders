components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Gismeteo-Token
  schemas:
    Location:
      type: object
      description: "Информация о местоположении, включая название, координаты и временную зону."
      properties:
        name:
          description: "Наименование населённого пункта в именительном падеже"
          type: string
          example: "Казань"
        latitude:
          description: "Географическая широта центра населённого пункта"
          type: number
          format: float
          example: 55.796501
        longitude:
          description: "Географическая долгота центра населённого пункта"
          type: number
          format: float
          example: 49.1082
        time_zone_offset:
          type: integer
          description: Смещение относительно UTC в минутах.
          example: 180
        country_name:
          description: "Название страны (обязательный параметр)."
          type: string
          example: "Россия"
        district_name:
          description: "Название округа/региона (необязательный параметр)."
          type: string
          example: "Республика Татарстан"
        sub_district_name:
          description: "Название района или административного округа (необязательный параметр, может быть пустым)."
          type: string
          example: "городской округ Казань"
        path:
          description: "URL-путь к странице прогноза погоды для выбранного населённого пункта."
          type: string
          example: "/weather-kazan-4364/"
    Forecast1:
      type: object
      description: Прогноз погоды с шагом 1 час
      properties:
        time:
          type: array
          description: "Срок прогноза в формате UTC"
          items:
            type: string
            format: date-time
            example: "2025-02-26T21:00:00Z"
        temperature_air:
          type: array
          description: "Температура воздуха (°C)"
          items:
            type: number
            example: -3.56
        temperature_heat_index:
          type: array
          description: "Температура по ощущениям (°C)"
          items:
            type: number
            nullable: true
            example: -5.59
        temperature_water:
          type: array
          description: "Температура воды (°C)"
          items:
            type: number
            example: 0
        precipitation:
          description: "Количество осадков (мм)"
          type: array
          items:
            type: number
            nullable: true
            example: null
        precipitation_type:
          description: |
            Тип осадков:
              * 0 – отсутствие осадков
              * 1 – дождь
              * 2 – снег
              * 3 – дождь со снегом
          type: array
          items:
            type: integer
            example: 0
        precipitation_intensity:
          description: |
            Интенсивность осадков:
              * 0 - Нет осадков
              * 1 - Небольшой дождь/снег
              * 2 - Дождь/снег
              * 3 - Сильный дождь/снег
          type: array
          items:
            type: integer
            nullable: true
            example: 0
        precipitation_probability:
          description: "Вероятность осадков (%)"
          type: array
          items:
            type: number
            example: 0
        pressure:
          description: "Атмосферное давление (мм рт. ст.)"
          type: array
          items:
            type: integer
            example: 756
        storm_prediction:
          description: "Триггер наличия грозы"
          type: array
          items:
            type: boolean
            example: false
        wind_direction:
          description: |
            Направление ветра (градусы, 0 - 360):
              * 337.6 - 22.5 - северный
              * 22.6 - 67.5  - северо-западный
              * 67.6 - 112.5 - восточный
              * 112.6 - 157.5 - юго-восточный
              * 157.6 - 202.5 - южный
              * 202.6 - 247.5 - юго-западный
              * 247.6 - 292.5 - западный
              * 292.6 - 337.5 - северо-западный
          type: array
          items:
            type: number
            nullable: true
            example: 225
        wind_speed:
          description: "Скорость ветра (м/с)"
          type: array
          items:
            type: number
            nullable: true
            example: 0.65
        wind_gust:
          description: "Порывы ветра (м/с)"
          type: array
          items:
            type: number
            nullable: true
            example: 1.43
        cloudiness:
          description: |
            Облачность (%):
              * от 0% до 25% - Ясно
              * от 26% до 50% - Малооблачно
              * от 51% до 75% - Облачно
              * от 76% до 100% - Пасмурно
          type: array
          items:
            type: number
            example: 0
        humidity:
          description: "Относительная влажность воздуха (%)"
          type: array
          items:
            type: number
            example: 60
        dew_point:
          description: "Точка росы (°C)"
          type: array
          items:
            type: number
            example: -10.19
        snow_height:
          description: "Высота снежного покрова (см)"
          type: array
          items:
            type: number
            nullable: true
            example: 3
        snow_fall:
          description: "Водный эквивалент твердых осадков (мм)"
          type: array
          items:
            type: number
            nullable: true
            example: 0
        icon_weather:
          description: "Погодная иконка"
          type: array
          items:
            type: string
            example: "n_c3_r3"
        description:
          description: "Описание погодных явлений"
          type: array
          items:
            type: string
            example: "Пасмурно, сильный дождь"
        pollen_birch:
          description: |
            Пыльца березы:
              * 1-29 - 1 балл  
              * 30-199 - 2 балла  
              * 200-999 - 3 балла  
              * 1000-4999 - 4 балла  
              * 5000 и более - 5 баллов
          type: array
          items:
            type: integer
            nullable: true
            example: null
        pollen_grass:
          description: |
            Пыльца травы:
              * 1-9 - 1 балл
              * 10-49 - 2 балла
              * 50-199 - 3 балла
              * 200-1499 - 4 балла
              * 1500 и более - 5 баллов
          type: array
          items:
            type: integer
            nullable: true
            example: null
        radiation:
          description: |
            УФ-индекс (баллы), уровень  ультрафиолетового излучения Солнца:
              * 0–2 - низкий
              * 3–5 - умеренный
              * 6–7 - высокий
              * 8–10 - очень высокий
              * 11+  - экстремальный
          type: array
          items:
            type: integer
            nullable: true
            example: 0
        road_condition_code:
          description: |
            Состояние дорожного покрытия:
               * 0 – Нет данных
               * 1 – Сухая дорога
               * 2 – Мокрая дорога
               * 3 – Лед/снег на дороге
               * 4 – Смесь воды и снега на дороге
               * 5 – Роса
               * 6 – Тающий снег
               * 7 – Мороз
               * 8 – Ледяной дождь
          type: array
          items:
            type: integer
            nullable: true
            example: 11
    Forecast3:
      type: object
      description: Прогноз погоды с шагом 3 часа
      properties:
        time:
          type: array
          description: "Срок прогноза в формате UTC"
          items:
            type: string
            format: date-time
            example: "2025-02-26T21:00:00Z"
        temperature_air:
          type: array
          description: "Температура воздуха (°C)"
          items:
            type: number
            example: -3.56
        temperature_heat_index:
          type: array
          description: "Температура по ощущениям (°C)"
          items:
            type: number
            nullable: true
