openapi: 3.0.0
info:
  title: Weather Forecast API
  description: |
    API для получения прогноза погоды и текущих метеоусловий.
    Для определения местоположения необходимо указать один из следующих параметров: name или coordinates.
    
    # О сервисе
    Сервис предоставляет данные о погоде – прогноз с различными шагами агрегирования, текущие условия и астрономическую информацию.
    
    # Иконки
    Для отображение иконок используйте данный [набор](https://st.gismeteo.st/api/icons/icons.zip).
    
    # Аутентификация
    Для аутентификации используйте токен доступа. В каждом запросе добавляйте заголовок `X-Gismeteo-Token` со значением `<API_TOKEN>`.
    
    Пример запроса:
    ```
    GET /v4/weather/forecast/h1 HTTP/1.1
    Host: api.gismeteo.net
    X-Gismeteo-Token: <API_TOKEN>
    ```
  version: 4.0.1
  contact:
    name: API Support
    email: info@gismeteo.ru
    url: https://www.gismeteo.ru
  x-logo:
    url: "https://static.gismeteo.st/yaml/logo.beta.png"
    altText: Gismeteo

servers:
  - url: https://api.gismeteo.net/v4/weather
    description: Основной сервер API

tags:
  - name: Запросы
    description: Основные методы API погоды

# Вынесем общие параметры в якорь для всех forecast-методов
paths:
  /current:
    get:
      summary: Получение текущей погоды
      description: >
        Возвращает текущую погоду.
        Для определения местоположения необходимо передать один из следующих параметров: name или coordinates.
      tags:
        - Запросы
      parameters:
        - name: name
          in: query
          description: Название населенного пункта (один из вариантов)
          example: "москва"
          schema:
            type: string
        - name: coordinates
          in: query
          description: >
            Координаты местоположения (широта, долгота) – пример: "55.755798,37.617599" (один из вариантов)
          example: "55.755798,37.617599"
          schema:
            type: string
        - name: locale
          in: query
          description: |
            Возможные значения (язык-регион):
              * ru-RU
              * lt-LT
              * ru-LT
              * lv-LV
              * ru-LV
              * uk-UA
              * ru-UA
              * ru-KZ
              * ru-BY
              * pl-PL
              * en-GB
          example: ru-RU
          schema:
            type: string
      responses:
        "200":
          description: Успешный ответ с данными о погоде
          content:
            application/json:
              schema:
                type: object
                properties:
                  location:
                    $ref: "#/components/schemas/Location"
                  current:
                    $ref: "#/components/schemas/Current"
                  astronomy:
                      $ref: "#/components/schemas/Astronomy"
        "400":
          description: Неверный запрос (Bad Request). Отсутствуют обязательные параметры или переданы некорректные данные.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    description: Метаданные ответа с кодом ошибки.
                    properties:
                      status_code:
                        type: integer
                        example: 400
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          example: "Bad Request"
                        detail:
                          type: string
                          example: "Param to search for is not defined"
        "401":
          description: Ошибка аутентификации (Unauthorized). Отсутствует или недействительный токен.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      status_code:
                        type: integer
                        example: 401
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          example: "Unauthorized"
                        detail:
                          type: string
                          example: "Token is required"
        "404":
          description: Данные не найдены (Not Found).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      status_code:
                        type: integer
                        example: 404
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          example: "Not Found"
                        detail:
                          type: string
                          example: "Page not found"
        "429":
          description: Превышено количество запросов (Rate Limit Exceeded).
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      status_code:
                        type: integer
                        example: 429
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          example: "Too Many Requests"
                        detail:
                          type: string
                          example: "Rate limit exceeded. Try again later."
      x-codeSamples:
        - lang: 'cURL'
          label: 'cURL'
          source: |
            curl -X GET 'https://api.gismeteo.net/v4/weather/current?name=Москва&locale=ru-RU' \
            --header 'X-Gismeteo-Token: YOUR_TOKEN'
        - lang: 'Python'
          label: 'Python'
          source: |
            import requests
            
            url = "https://api.gismeteo.net/v4/weather/current?name=Москва&locale=ru-RU"
            payload = {}
            headers = {
              'X-Gismeteo-Token': 'YOUR_TOKEN'
            }
            response = requests.request("GET", url, headers=headers, data=payload)
            
            print(response.text)
        - lang: 'Golang'
          label: 'Golang'
          source: |
            package main
            
            import (
              "fmt"
              "net/http"
              "io"
            )
            
            func main() {
              url := "https://api.gismeteo.net/v4/weather/current?name=Москва&locale=ru-RU"
              method := "GET"
            
              client := &http.Client {}
              req, err := http.NewRequest(method, url, nil)
              if err != nil {
                fmt.Println(err)
                return
              }
              req.Header.Add("X-Gismeteo-Token", "YOUR_TOKEN")
            
              res, err := client.Do(req)
              if err != nil {
                fmt.Println(err)
                return
              }
              defer res.Body.Close()
            
              body, err := io.ReadAll(res.Body)
              if err != nil {
                fmt.Println(err)
                return
              }
              fmt.Println(string(body))
            }
      security:
        - ApiKeyAuth: [ ]
